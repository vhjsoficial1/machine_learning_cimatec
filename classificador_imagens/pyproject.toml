[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "module_classificador_imagens"
version = "0.0.1"
description = "Sistema estruturado em python para Classifica\u00e7\u00e3o de Imagens"
authors = [
  { name = "vitu_lindu" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tensorflow>=2.21.0",
    "tqdm",
    "typer",
]
requires-python = "==3.12.6"


[tool.ruff]
line-length = 99
src = ["module_classificador_imagens"]
include = ["pyproject.toml", "module_classificador_imagens/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["module_classificador_imagens"]
force-sort-within-sections = true

